<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<style>
  body { margin: 0; background: #0c1014; color: #f5f5f5; font: 14px system-ui; }
  .tray { overflow-x: auto; width: 100%; height: 110px; }
  .strip { position: relative; height: 100px; margin: 0; padding: 0; list-style: none; }
  .strip li { position: absolute; top: 0; width: 80px; text-align: center; }
  .strip [role=button] { display: inline-block; cursor: pointer; }
  .strip canvas { width: 66px; height: 66px; display: block; margin: 0 auto; }
  .strip img { width: 56px; height: 56px; border-radius: 50%; margin-top: -61px; position: relative; }
  .strip span { display: block; font-size: 12px; overflow: hidden; text-overflow: ellipsis; }
  article { height: 600px; margin: 8px 0; background: #222; }
  .nav { position: fixed; bottom: 0; left: 0; right: 0; display: flex; justify-content: space-around; background: #000; height: 50px; }
  .viewer { position: fixed; inset: 0; background: #0c1014; z-index: 10; }
</style></head>
<body><div id="root"></div>
<script>
const users = Array.from({ length: 30 }, (_, i) => ({ name: 'user' + i, seen: i % 3 === 0 }));
const root = document.getElementById('root');
const avatar = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="10" height="10"><rect width="10" height="10" fill="#8a8"/></svg>');
window.mockLog = [];

function h(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith('on')) node.addEventListener(k.slice(2), v); else node.setAttribute(k, v);
  }
  node.append(...children);
  return node;
}

function ring(canvas, seen) {
  canvas.width = canvas.height = 132;
  const c = canvas.getContext('2d');
  c.lineWidth = 6;
  if (seen) c.strokeStyle = '#555';
  else { const g = c.createLinearGradient(0, 132, 132, 0); g.addColorStop(0, '#feda75'); g.addColorStop(1, '#d62976'); c.strokeStyle = g; }
  c.beginPath(); c.arc(66, 66, 62, 0, Math.PI * 2); c.stroke();
}

function renderHome() {
  root.replaceChildren();
  const strip = h('ul', { class: 'strip', style: `width:${users.length * 80}px` });
  const tray = h('div', { class: 'tray' }, strip);
  // Virtualised like Instagram: only items near the scroll position exist.
  const paint = () => {
    const first = Math.max(0, Math.floor(tray.scrollLeft / 80) - 1);
    strip.replaceChildren();
    for (let i = first; i < Math.min(users.length, first + 8); i++) {
      const u = users[i];
      const canvas = h('canvas');
      ring(canvas, u.seen);
      strip.append(h('li', { style: `left:${i * 80}px` },
        h('div', { role: 'button', tabindex: '0', 'aria-label': `Story by ${u.name}, ${u.seen ? 'seen' : 'not seen'}`,
          onclick: () => openViewer(i) }, canvas, h('img', { src: avatar, alt: `${u.name}'s profile picture` }), h('span', {}, u.name))));
    }
  };
  tray.addEventListener('scroll', paint);
  paint();
  // After a story closes, Instagram renders home in a loading layout: a
  // full-screen main with the tray centred in it.
  const main = h('main', { role: 'main', style: window.afterStory ? 'min-height:100vh;display:flex;flex-direction:column;justify-content:center' : '' }, h('div', { class: 'column' }, tray,
    ...Array.from({ length: 3 }, (_, i) => h('article', {}, 'Post ' + i))));
  const nav = h('div', { class: 'nav' },
    h('a', { href: '/' }, 'Home'), h('a', { href: '/explore/' }, 'Explore'), h('a', { href: '/reels/' }, 'Reels'),
    h('a', { href: '/direct/inbox/' }, 'Messages'),
    h('a', { href: '/mockme/' }, h('img', { src: avatar, alt: "mockme's profile picture", width: 24 })));
  for (const a of nav.querySelectorAll('a')) a.addEventListener('click', e => { e.preventDefault(); history.pushState({}, '', a.getAttribute('href')); route(); });
  root.append(main, nav);
}

function openViewer(i) {
  window.mockLog.push('open:' + users[i].name);
  history.pushState({}, '', `/stories/${users[i].name}/${1000 + i}/`);
  route();
}

function renderViewer(name) {
  root.replaceChildren(h('section', { class: 'viewer', role: 'dialog' },
    h('div', {}, 'Viewing ' + name),
    h('button', { 'aria-label': 'Close', onclick: () => {
      users.find(u => u.name === name).seen = true;
      window.afterStory = true;
      history.back();
    } }, 'Close')));
}

function renderChat(id) {
  // Mobile DM thread as it loads: one wrapper holds Instagram's tab links and
  // a spinner, then the conversation (no <main>/<header>) is added to it.
  const wrap = h('div', { class: 'wrap' },
    h('a', { href: '/' }, 'Home'), h('a', { href: '/explore/' }, 'Explore'),
    h('a', { href: '/reels/' }, 'Reels'), h('a', { href: '/direct/inbox/' }, 'Messages'),
    h('div', { class: 'loading' }, 'Loading...'));
  root.replaceChildren(wrap);
  setTimeout(() => {
    wrap.querySelector('.loading').remove();
    wrap.append(h('div', { class: 'thread' }, h('div', {}, 'Chat ' + id),
      h('div', { role: 'grid', 'aria-label': 'Messages in conversation' }, h('div', { role: 'row' }, 'hello')),
      h('textarea', { placeholder: 'Message...' })));
  }, 600);
}

function route() {
  const m = location.pathname.match(/^\/stories\/([^/]+)\//);
  const t = location.pathname.match(/^\/direct\/t\/([^/]+)\//);
  if (t) renderChat(t[1]);
  else if (m) renderViewer(m[1]);
  else if (location.pathname === '/') renderHome();
  else root.replaceChildren(h('main', { role: 'main' }, 'Page ' + location.pathname));
}
addEventListener('popstate', route);
route();
</script></body></html>
